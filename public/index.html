<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=3"><link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png?v=3"><link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3"><meta name="apple-mobile-web-app-title" content="Parus"><meta name="apple-mobile-web-app-capable" content="yes">
<title>Parus</title>
<style>
:root{--bg:#0e1116;--card:#171b22;--card2:#1f2530;--acc:#7c5cff;--acc2:#3ecbff;--txt:#eef1f6;--mut:#8b94a5;--g:linear-gradient(135deg,#7c5cff,#3ecbff)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100dvh;background:#07090d;color:var(--txt);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;justify-content:center;overflow:hidden}
#root{position:relative;width:100%;max-width:480px;height:100dvh;background:var(--bg);overflow:hidden}
@media(min-width:500px){body{align-items:center}#root{height:min(900px,96dvh);border-radius:28px;box-shadow:0 30px 80px #000a;border:1px solid #ffffff12}}
.hide{display:none!important}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:var(--txt);outline:0}
svg{width:24px;height:24px;display:block}
.av{width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;font-size:20px;overflow:hidden;color:#fff;background:var(--card2)}
.av img{width:100%;height:100%;object-fit:cover;animation:fade .4s}
.av.sm{width:40px;height:40px;font-size:16px}.av.xl{width:112px;height:112px;font-size:44px}
.fld{width:100%;padding:14px 16px;border-radius:14px;border:1px solid #ffffff14;background:var(--card);transition:.2s}
.fld:focus{border-color:var(--acc);box-shadow:0 0 0 3px #7c5cff30}
.btn{width:100%;padding:14px;border-radius:14px;background:var(--g);font-weight:600;transition:transform .15s,filter .2s}
.btn:active{transform:scale(.97)}.btn:hover{filter:brightness(1.1)}
.btn.sec{background:var(--card2)}.btn.red{background:#3a1d24;color:#ff6b7d}
@keyframes fade{from{opacity:0}}
@keyframes up{from{opacity:0;transform:translateY(18px)}}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.85)}}
@keyframes float{50%{transform:translateY(-8px)}}
@keyframes bump{40%{transform:scale(1.18) rotate(4deg)}}
@keyframes ring{from{transform:scale(1);opacity:.6}to{transform:scale(2.2);opacity:0}}
@keyframes blink{50%{opacity:.2}}
/* auth */
#auth{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;justify-content:center;gap:12px;padding:32px;background:radial-gradient(circle at 20% 0,#7c5cff40,transparent 50%),radial-gradient(circle at 90% 100%,#3ecbff30,transparent 50%),var(--bg);animation:fade .4s}
#auth>*{animation:up .5s backwards}#auth>:nth-child(2){animation-delay:.05s}#auth>:nth-child(3){animation-delay:.1s}#auth>:nth-child(4){animation-delay:.15s}#auth>:nth-child(5){animation-delay:.2s}#auth>:nth-child(6){animation-delay:.25s}
.logo{width:84px;height:84px;border-radius:26px;background:var(--g);display:grid;place-items:center;margin:0 auto;animation:float 3.5s infinite ease-in-out!important;box-shadow:0 14px 40px #7c5cff55}
.logo svg{width:44px;height:44px;stroke:#fff}
#auth h1{margin:6px 0 0;text-align:center;font-size:26px}
.pw{position:relative}.pw .fld{padding-right:52px}.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:42px;height:42px;display:grid;place-items:center;border-radius:50%;color:var(--mut);transition:color .2s,background .2s}.eye:active{background:#ffffff12}.eye.on{color:var(--acc2)}.eye svg{animation:pop .25s}
.link{color:var(--acc2);text-align:center;padding:8px}.err{color:#ff6b7d;text-align:center;min-height:20px}
/* tabs & nav */
.tab{position:absolute;inset:0 0 calc(64px + env(safe-area-inset-bottom)) 0;overflow-y:auto;opacity:0;pointer-events:none;transform:translateY(12px);transition:.3s}
.tab.on{opacity:1;pointer-events:auto;transform:none}
#app.swap .tab{opacity:0;transform:scale(.97)}
#nav{position:absolute;left:0;right:0;bottom:0;display:flex;height:calc(64px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#12161dd9;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid #ffffff10;z-index:5}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--mut);transition:color .25s}
#nav button svg{transition:transform .35s cubic-bezier(.3,1.8,.5,1)}
#nav button.on{color:#fff}#nav button.on svg{transform:translateY(-2px) scale(1.18);stroke:var(--acc2)}
#ind{position:absolute;top:0;left:0;width:50%;height:3px;display:flex;justify-content:center;transition:transform .4s cubic-bezier(.4,1.4,.5,1)}
#ind i{width:44px;height:3px;border-radius:0 0 4px 4px;background:var(--g)}
.badge{position:absolute;margin:-26px -26px 0 0;min-width:18px;height:18px;border-radius:9px;background:#ff4d6a;font-size:11px;display:grid;place-items:center;padding:0 5px}
/* chats list */
.top{padding:18px 18px 10px;position:sticky;top:0;background:linear-gradient(var(--bg) 80%,transparent);z-index:2}
.top h2{margin:0 0 12px;font-size:28px}
.row{display:flex;gap:12px;align-items:center;padding:10px 18px;cursor:pointer;transition:background .2s;animation:up .45s backwards;animation-delay:calc(var(--i,0)*45ms)}
.row:active,.row:hover{background:#ffffff08}
.row .mid{flex:1;min-width:0}.row b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row small{color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{text-align:right;font-size:12px;color:var(--mut);display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.unr{background:var(--g);color:#fff;border-radius:10px;min-width:20px;padding:0 6px;font-size:12px;animation:pop .3s}
.empty{text-align:center;color:var(--mut);padding:60px 30px;animation:up .5s}
/* chat */
#chat{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;background:var(--bg);transform:translateX(100%);transition:transform .4s cubic-bezier(.3,.9,.3,1)}
#chat.open{transform:none}
.ch-h{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#12161d;border-bottom:1px solid #ffffff10}
.ib{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;transition:.2s}.ib:active{transform:scale(.88);background:#ffffff12}
#ch-user{flex:1;display:flex;align-items:center;gap:10px;min-width:0}#ch-user b{display:block}#ch-user small{color:var(--mut)}
#msgs{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:6px;background:radial-gradient(circle at 80% 0,#7c5cff14,transparent 50%)}
.msg{max-width:78%;padding:8px 12px;border-radius:18px;word-break:break-word;white-space:pre-wrap;position:relative}
.msg.anim{animation:pop .35s cubic-bezier(.3,1.4,.5,1)}
.msg.me{align-self:flex-end;background:var(--g);border-bottom-right-radius:6px}
.msg.them{align-self:flex-start;background:var(--card2);border-bottom-left-radius:6px}
.msg time{display:block;font-size:11px;opacity:.65;text-align:right;margin-top:2px}
.msg.img{padding:4px}.msg.img img{display:block;max-width:100%;width:240px;border-radius:14px;cursor:zoom-in;animation:fade .5s}
.msg.img time{position:absolute;right:10px;bottom:8px;background:#0008;padding:1px 6px;border-radius:8px;margin:0}
.voice{display:flex;align-items:center;gap:10px;min-width:190px}
.pl{width:38px;height:38px;border-radius:50%;background:#fff3;display:grid;place-items:center;flex:none;transition:transform .15s}.pl:active{transform:scale(.88)}.pl svg{width:18px;height:18px}
.bar{flex:1;height:5px;border-radius:3px;background:#fff3;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#fff;transition:width .25s linear}
.dur{font-size:12px;min-width:34px}
.inp{display:flex;align-items:center;gap:6px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#12161d;border-top:1px solid #ffffff10}
.inp input[type=text]{flex:1;padding:12px 16px;border-radius:22px;border:0;background:var(--card2)}
#sb{width:44px;height:44px;border-radius:50%;background:var(--g);display:grid;place-items:center;transition:transform .15s}#sb:active{transform:scale(.88)}
#sb svg{animation:pop .3s;width:22px;height:22px}
.rec{flex:1;display:flex;align-items:center;gap:10px;padding-left:10px;animation:up .25s}
.rec i{width:12px;height:12px;border-radius:50%;background:#ff4d6a;animation:blink 1s infinite}
/* profile */
.prof{padding:30px 22px;display:flex;flex-direction:column;gap:14px;align-items:center}
.prof>*{animation:up .5s backwards}.prof>:nth-child(2){animation-delay:.06s}.prof>:nth-child(3){animation-delay:.12s}.prof>:nth-child(4){animation-delay:.18s}
.avw{position:relative;cursor:pointer}.avw .cam{position:absolute;right:0;bottom:0;width:36px;height:36px;border-radius:50%;background:var(--g);display:grid;place-items:center;border:3px solid var(--bg)}.cam svg{width:18px;height:18px}
.bump{animation:bump .6s}
.accs{width:100%;background:var(--card);border-radius:18px;padding:6px 0;margin-top:6px}
.accs h4{margin:10px 18px 4px;color:var(--mut);font-weight:500}
.chk{color:var(--acc2);font-weight:700}
/* call */
#call{position:absolute;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:90px 20px 70px;background:radial-gradient(circle at 50% 30%,#4a35b8,#0e1116 70%);opacity:0;pointer-events:none;transform:scale(1.08);transition:.35s}
#call.on{opacity:1;pointer-events:auto;transform:none}
.cav{position:relative;margin:0 auto}.cav::before,.cav::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--acc2);animation:ring 2s infinite}.cav::after{animation-delay:1s}
#call.live .cav::before,#call.live .cav::after{animation-play-state:paused;opacity:0}
#call h2{margin:22px 0 4px;text-align:center}#c-st{text-align:center;color:#ffffffaa}
.ctl{display:flex;gap:30px}.cb{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:#ffffff22;transition:.2s}.cb:active{transform:scale(.88)}
.cb.red{background:#ff4d6a}.cb.green{background:#2fd26f;animation:float 1.4s infinite}.cb.mute.on{background:#fff;color:#111}
#call[data-mode=in] .c-out,#call[data-mode=out] .c-in{display:none}
#lb{position:absolute;inset:0;z-index:50;background:#000e;display:grid;place-items:center;opacity:0;pointer-events:none;transition:.3s}#lb.on{opacity:1;pointer-events:auto}
#lb img{max-width:96%;max-height:90%;border-radius:12px;transform:scale(.9);transition:.35s}#lb.on img{transform:none}
#toast{position:absolute;left:50%;top:16px;z-index:60;transform:translate(-50%,-80px);background:#232a36;padding:10px 18px;border-radius:16px;box-shadow:0 8px 30px #0008;transition:transform .4s cubic-bezier(.3,1.5,.5,1);max-width:90%;text-align:center}
#toast.on{transform:translate(-50%,0)}

.th{display:flex;align-items:center;justify-content:space-between}
.plus{background:var(--g);margin-bottom:12px;box-shadow:0 6px 18px #7c5cff55}.plus svg{transition:transform .35s cubic-bezier(.3,1.6,.5,1)}.plus:hover svg{transform:rotate(90deg)}.plus:active{transform:scale(.85)}
#msgs{overflow-x:hidden}
.msg{touch-action:pan-y;user-select:none;-webkit-user-select:none;transition:transform .35s cubic-bezier(.3,1.6,.5,1),box-shadow .2s,max-height .3s,opacity .3s}
.msg.hl{transform:scale(1.04);box-shadow:0 10px 30px #0008}
.sn{font-size:13px;font-weight:600;margin-bottom:2px}
.fw{font-size:12px;opacity:.85;font-style:italic;margin-bottom:3px}
.rq{border-left:3px solid #fffd;background:#00000026;border-radius:6px;padding:3px 8px;margin:0 0 5px;cursor:pointer;font-size:13px}
.rq b{display:block;font-size:12px}.rq span{display:block;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:210px}
.msg.them .rq{border-color:var(--acc2)}
.swi{position:absolute;left:100%;top:50%;margin-left:14px;width:34px;height:34px;border-radius:50%;background:#ffffff1f;display:grid;place-items:center;opacity:0;transform:translateY(-50%) scale(.4);pointer-events:none}.swi svg{width:18px;height:18px}
.msg.flash{animation:flash 1.2s}@keyframes flash{30%{filter:brightness(1.7);transform:scale(1.04)}}
.msg.sel{box-shadow:0 0 0 2px var(--acc2)}
.msg.sel::after{content:"✓";position:absolute;top:-7px;left:-7px;width:20px;height:20px;border-radius:50%;background:var(--acc2);color:#06222c;font-size:13px;font-weight:700;display:grid;place-items:center;animation:pop .25s}
.msg.out{opacity:0;transform:scale(.6)!important;max-height:0!important;padding-top:0;padding-bottom:0;margin:-3px 0;overflow:hidden}
.file{display:flex;gap:10px;align-items:center;color:inherit;text-decoration:none;min-width:180px}
.file>svg{width:40px;height:40px;padding:8px;border-radius:50%;background:#ffffff33;flex:none}.file b{display:block;word-break:break-all;font-weight:600}.file small{opacity:.75}
.rbar{display:flex;align-items:center;gap:10px;padding:6px 10px 6px 14px;background:#12161d;border-top:1px solid #ffffff10;animation:up .25s}
.rbar .rl{width:3px;align-self:stretch;border-radius:2px;background:var(--g)}.rt2{flex:1;min-width:0}.rbar b{display:block;color:var(--acc2);font-size:13px}.rbar span{display:block;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}
.ro{padding:16px;text-align:center;color:var(--mut);background:#12161d;border-top:1px solid #ffffff10}
.sel-h{position:absolute;left:0;right:0;top:0;z-index:3;animation:down .25s}.sel-h span{flex:1;font-weight:600;font-size:17px;padding-left:8px}
@keyframes down{from{transform:translateY(-100%)}}
.pmb{position:absolute;inset:0;z-index:19;background:#0000004d;animation:fade .2s}
.pm{position:absolute;z-index:20;background:#232a36f2;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:16px;padding:6px;box-shadow:0 14px 40px #000a;animation:menuIn .28s cubic-bezier(.3,1.5,.5,1)}
.pi{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:11px;text-align:left;animation:up .25s backwards;transition:background .15s}
.pi:hover,.pi:active{background:#ffffff14}.pi svg{width:20px;height:20px;color:var(--mut)}.pi.red,.pi.red svg{color:#ff6b7d}
@keyframes menuIn{from{opacity:0;transform:scale(.5)}}
.pm.bye,.pmb.bye{animation:byeA .16s forwards}@keyframes byeA{to{opacity:0;transform:scale(.9)}}
.sw{position:absolute;inset:0;z-index:35;background:#0009;display:flex;align-items:flex-end;animation:fade .25s}
.sp{width:100%;max-height:88%;background:var(--bg);border-radius:24px 24px 0 0;display:flex;flex-direction:column;animation:sheetUp .4s cubic-bezier(.3,1.1,.4,1);border-top:1px solid #ffffff14}
@keyframes sheetUp{from{transform:translateY(100%)}}
.sw.bye{animation:fadeOut .25s forwards}.sw.bye .sp{transform:translateY(100%);transition:transform .25s}@keyframes fadeOut{to{opacity:0}}
.sh{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 6px 20px;font-size:17px}
.sb2{padding:8px 16px calc(20px + env(safe-area-inset-bottom));overflow-y:auto;display:flex;flex-direction:column;gap:12px}
.sb2 .avw{align-self:center}.sb2 .row{padding-left:4px;padding-right:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chip{display:flex;align-items:center;gap:6px;background:var(--card2);border-radius:16px;padding:3px 10px 3px 3px;animation:pop .25s;cursor:pointer}
.av.xs{width:24px;height:24px;font-size:12px}.pk{display:flex;flex-direction:column;gap:8px}

#inp{align-items:flex-end}
.inp textarea{flex:1;display:block;padding:12px 16px;border-radius:22px;border:0;background:var(--card2);color:var(--txt);font:inherit;line-height:20px;height:44px;max-height:130px;resize:none;outline:0;overflow-y:auto;scrollbar-width:none;transition:height .12s}
.inp textarea::-webkit-scrollbar{display:none}
.row{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.row.hl{background:#ffffff12}
.pn svg{width:14px;height:14px;color:var(--acc2)}
.seg{display:flex;background:var(--card);border-radius:14px;padding:4px;gap:4px}.seg button{flex:1;padding:10px;border-radius:11px;transition:.25s;color:var(--mut)}.seg button.on{background:var(--g);color:#fff}

#shbtn.live{color:#ff4d6a;animation:blink 1.2s infinite}
.shr{display:flex;flex-wrap:wrap;align-items:center;gap:10px}.shr>svg{width:38px;height:38px;padding:7px;border-radius:50%;background:#ffffff2e;flex:none}.shr>div{flex:1}.shr b{display:block}.shr small{opacity:.75}
.shr.live>svg{color:#ff6b7d;animation:blink 1.2s infinite}
.shr .btn{width:100%;padding:10px;background:#ffffff33}.msg.them .shr .btn{background:var(--g);animation:pulseB 1.8s infinite}
@keyframes pulseB{0%{box-shadow:0 0 0 0 #7c5cff88}100%{box-shadow:0 0 0 14px #7c5cff00}}
.msg.shrm{min-width:240px;padding:12px 14px}
#shbar{position:absolute;top:12px;left:50%;z-index:38;transform:translate(-50%,-90px);display:flex;align-items:center;gap:10px;background:#ff4d6a;padding:8px 8px 8px 16px;border-radius:24px;box-shadow:0 10px 30px #ff4d6a66;transition:transform .45s cubic-bezier(.3,1.5,.5,1);white-space:nowrap}
#shbar.on{transform:translate(-50%,0)}#shbar i{width:9px;height:9px;border-radius:50%;background:#fff;animation:blink 1s infinite}#shbar button{background:#0003;border-radius:16px;padding:6px 12px}
#shv{position:absolute;inset:0;z-index:42;background:#000;display:flex;flex-direction:column;opacity:0;pointer-events:none;transform:scale(.93);transition:.4s cubic-bezier(.3,1.2,.4,1)}
#shv.on{opacity:1;pointer-events:auto;transform:none}
.shh{display:flex;align-items:center;gap:4px;padding:10px 12px;background:#101319;color:#fff}.shh b{flex:1;padding-left:6px}
#sv{flex:1;min-height:0;width:100%;object-fit:contain;background:#000}
.shw{position:absolute;inset:60px 0 0;display:grid;place-items:center;color:#fff9;pointer-events:none;transition:opacity .4s}#shv.live .shw{opacity:0}
#chat-empty{display:none}
@media(min-width:900px){
:root{--lw:390px}
body{font-size:16px}
#root{max-width:1260px;width:96vw;height:min(880px,94dvh);border-radius:24px}
.tab{right:auto;width:var(--lw);border-right:1px solid #ffffff12}
#nav{right:auto;width:var(--lw);border-right:1px solid #ffffff12}
#chat-empty{display:flex;position:absolute;left:var(--lw);right:0;top:0;bottom:0;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:var(--mut);background:radial-gradient(circle at 70% 20%,#7c5cff22,transparent 55%);animation:fade .5s}
#chat-empty .logo{animation:float 3.5s infinite ease-in-out}
#chat{left:var(--lw);transform:translateX(30px);opacity:0;pointer-events:none;transition:opacity .3s,transform .4s cubic-bezier(.3,1.2,.4,1)}
#chat.open{transform:none;opacity:1;pointer-events:auto}
#back{display:none}
.av{width:52px;height:52px}.av.sm{width:44px;height:44px}.av.xl{width:128px;height:128px;font-size:50px}.av.xs{width:24px;height:24px}
.row{padding:12px 22px}.top{padding:22px 22px 12px}
.msg{max-width:62%;font-size:16px;padding:9px 14px}.msg.img img{width:320px}
#msgs{padding:18px 6%}.inp{padding:12px 6%}.ch-h{padding:12px 20px}
.inp textarea{font-size:16px}
#auth>*{width:100%;max-width:400px;align-self:center}
.sw{align-items:center;justify-content:center}.sp{max-width:500px;border-radius:24px;max-height:86%}
#toast{left:calc(50% + var(--lw)/2)}
}
.row img{-webkit-user-drag:none;user-select:none;pointer-events:none}.row{touch-action:pan-y}

#lock{position:absolute;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;text-align:center;padding:32px;background:radial-gradient(circle at 50% 25%,#3d2b99,#0b0d12 70%);opacity:0;pointer-events:none;transition:opacity .5s}
#lock.on{opacity:1;pointer-events:auto}
.lkc{max-width:380px;display:flex;flex-direction:column;align-items:center;gap:14px}
.lkc>*{animation:up .7s backwards}.lkc>:nth-child(2){animation-delay:.1s}.lkc>:nth-child(3){animation-delay:.2s}.lkc>:nth-child(4){animation-delay:.3s}
.lkc h2{margin:0;font-size:28px}.lkc p{margin:0;color:#ffffffb0}
.gears{display:flex;align-items:flex-end;height:110px}.g1,.g2{display:inline-block}
.g1{font-size:88px;animation:spin 7s linear infinite}.g2{font-size:54px;margin-left:-16px;animation:spin 4.5s linear infinite reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.shim{width:180px;height:5px;border-radius:3px;background:#ffffff1a;overflow:hidden;position:relative}
.shim::after{content:"";position:absolute;top:0;bottom:0;left:0;width:40%;background:var(--g);border-radius:3px;animation:slide 1.4s infinite ease-in-out}

function shrink(file,max){return new Promise((ok,no)=>{createImageBitmap(file).then(b=>{const k=Math.min(1,max/Math.max(b.width,b.height)),c=document.createElement('canvas');c.width=b.width*k;c.height=b.height*k;c.getContext('2d').drawImage(b,0,0,c.width,c.height);c.toBlob(x=>x?ok(x):no(),'image/jpeg',.85)}).catch(no)})}

/* start */
async function start(){
  if(sock){sock.disconnect();sock=null}me=null;
  try{me=await api('/api/me')}catch(e){
    const a=accs.find(x=>x.id===cur);
    if(e.message==='auth'){
      if(a&&a.imp&&await reImp(a))return start();
      let r=false;try{r=await relogin(a)}catch{r='net'}
      if(r==='ok')return start();
      if(r==='net'){toast('Нет соединения…');return setTimeout(start,4000)}
      if(r==='maint'){needStart=true;maint=true;admMode=false;renderLock();return}
      if(r==='banned')return onBanned(a);
      if(r==='deleted')return showDeleted(a);
      if(a){a.expired=true;saveA()}
      const o=accs.find(x=>!x.expired&&!x.banned);if(o){cur=o.id;saveA();return start()}
      $('#app').classList.add('hide');showAuth(false);$('#a-nick').value=a?a.nick:'';$('#a-err').textContent='Сессия истекла — войдите снова';return}
    if(e.message==='banned')return onBanned(a);
    if(e.message==='maint'){needStart=true;admMode=false;renderLock();return}
    toast('Нет соединения…');return setTimeout(start,4000)}
  admMode=false;renderLock();
  const a=accs.find(x=>x.id===cur);Object.assign(a,me);delete a.expired;saveA();syncAvatar(a);ibarUpd(a);if(!a.imp&&accs.some(x=>x.imp)){dropImps();saveA();renderProfile()}syncAccs();loadIce();if(a.pw&&!a.imp&&!a.pws)api('/api/pwsync',{method:'POST',body:JSON.stringify({password:a.pw})}).then(()=>{a.pws=1;saveA()}).catch(()=>{});
  $('#auth').classList.add('hide');$('#app').classList.remove('hide');
  closeChat();chats.clear();unread.clear();mm.clear();blockedBy.clear();$('#list').innerHTML='';$('#msgs').innerHTML='';$('#q').value='';connect();await loadChats();renderProfile();tab('chats');
  setTimeout(()=>$('#app').classList.remove('swap'),50);
}
function connect(){
  sock=io({auth:{token:tok()}});
  sock.on('msg',onMsg);sock.on('group',addGroup);sock.on('group:gone',d=>gone(d.id));sock.on('del',onDel);sock.on('connect_error',e=>{if(e.message==='auth')start();else if(e.message==='banned')onBanned(accs.find(x=>x.id===cur))});sock.on('connect',()=>checkStatus());sock.on('connect',()=>{if(me)presAll()});sock.on('presence',onPresence);sock.on('act',onAct);sock.on('edited',onEdited);sock.on('read',onRead);sock.on('connect',()=>{if(me&&chats.size)loadChats().catch(()=>{})});sock.on('banned',()=>onBanned(accs.find(x=>x.id===cur),true));
  sock.on('role',d=>{if(!me)return;me.admin=d.admin;const a=accs.find(x=>x.id===cur);if(a){a.admin=d.admin;saveA()}renderLock();renderProfile();bigNote(d.admin?'👑':'👋',d.admin?'Вы теперь админ':'Вы больше не админ',d.admin?'Вам доступна админ-панель в профиле.':'Права администратора сняты.')});
  sock.on('user:gone',d=>{chats.delete('u:'+d.id);if(cp&&!cp.type&&cp.id===d.id){closeChat();toast('Пользователь удалил аккаунт')}if(!$('#q').value.trim())renderChats()});
  sock.on('deleted',d=>{const a=accs.find(x=>x.id===cur);if(!a)return;if(d&&d.admin)showDeleted(a);else{toast('Аккаунт удалён');removeAcc(a)}});sock.on('block',onBlockEv);sock.on('user:deleted',d=>{const a=accs.find(x=>x.id===d.id);if(a&&a.id!==cur)removeAcc(a,document.querySelector('#tab-profile .row[data-uid="'+a.id+'"]'))});sock.on('maint',d=>{maint=d.on;renderLock();if(me&&me.admin)renderProfile()});sock.on('profile',onProfile);sock.on('share:join',onShJoin);sock.on('share:offer',onShOffer);sock.on('share:answer',onShAnswer);sock.on('share:ice',onShIce);sock.on('share:leave',onShLeave);sock.on('share:end',onShEnd);
  sock.on('call:offer',d=>{if(pc||inc){sock.emit('call:end',{to:d.from});return}inc=d;cpeer=d.fromU;callUI(d.fromU,'Входящий звонок…','in');startRing();if(document.hidden||(window.parusDesktop&&!document.hasFocus()))pushNote('📞 Входящий звонок',d.fromU.name+' звонит вам','call',{requireInteraction:true,data:{key:'u:'+d.fromU.id,avatar:d.fromU.avatar?location.origin+d.fromU.avatar:''}})});
  sock.on('call:answer',async d=>{if(!pc)return;stopRing();await pc.setRemoteDescription(d.sdp);for(const c of pend)await pc.addIceCandidate(c);pend=[];$('#c-st').textContent='Соединение…'});
  sock.on('call:ice',async d=>{if(pc&&pc.remoteDescription)try{await pc.addIceCandidate(d.c)}catch{}else pend.push(d.c)});
  sock.on('call:end',d=>{if(cpeer&&d.from===cpeer.id){toast('Звонок завершён');endCall(false)}});
}
const ent=c=>c.peer||c.group;
const keyOf=c=>c.peer?'u:'+c.peer.id:'g:'+c.group.id;

function addGroup(g){const k='g:'+g.id,ex=chats.get(k);chats.set(k,{group:g,last:ex?ex.last:null,pinned:ex&&ex.pinned});if(cp&&cp.id===g.id){cp=g;setHead()}if(!$('#q').value.trim())renderChats()}

function onMsg(m){
  const key=m.chat?'g:'+m.chat:'u:'+(m.from===me.id?m.to:m.from),ex=chats.get(key);
  {const am=acts.get(key);if(am&&am.delete(m.from))setTimeout(()=>actUpdate(key),0)}
  if(m.chat){if(!ex)return loadChats();ex.last=m}else chats.set(key,{peer:m.from===me.id?m.toU:m.fromU,last:m,pinned:ex&&ex.pinned});
  if(cp&&curKey()===key){if(!(m.cid&&confirmPending(m)))addMsg(m,true);if(!m.chat&&m.from!==me.id)markRead(m.from)}
  else if(m.from!==me.id){unread.set(key,(unread.get(key)||0)+1);toast(m.type==='share'?(m.fn||ent(chats.get(key)).name)+' начал трансляцию':ent(chats.get(key)).name+': '+(m.chat?m.fn+': ':'')+prev(m).slice(0,40))}
  if(m.from!==me.id&&!(m.type==='call'&&m.ans))incomingAlert(m,key);
  if(!$('#q').value.trim())renderChats();updBadge();
}

  const arr=[...chats.values()].sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)||tsOf(b)-tsOf(a));
  if(!arr.length){L.innerHTML='';rowEls.clear();L.append(h('div','empty','Пока нет чатов.<br>Найди друга по нику или нажми ＋ чтобы создать группу или канал'));return}
  const em=L.querySelector('.empty');if(em)em.remove();
  const keys=new Set(arr.map(keyOf));rowEls.forEach((el,k)=>{if(!keys.has(k)){el.remove();rowEls.delete(k)}});
  const old=new Map();rowEls.forEach((el,k)=>old.set(k,el.getBoundingClientRect().top));
  arr.forEach((c,i)=>{
    const k=keyOf(c);let el=rowEls.get(k);
    if(!el){el=makeRow(c,i);rowEls.set(k,el)}else updateRow(el,c);

function voiceEl(m){

  const ICP='<svg viewBox="0 0 24 24"><path d="M8.2 5.3v13.4a1 1 0 0 0 1.5.86l10.9-6.7a1 1 0 0 0 0-1.72L9.7 4.44a1 1 0 0 0-1.5.86z" fill="currentColor"/></svg>',
    ICS='<svg viewBox="0 0 24 24"><rect x="6.2" y="5" width="4.2" height="14" rx="1.7" fill="currentColor"/><rect x="13.6" y="5" width="4.2" height="14" rx="1.7" fill="currentColor"/></svg>';
  b.innerHTML=ICP;
  let seed=0;for(const ch of String(m.url||m.id))seed=(seed*31+ch.charCodeAt(0))>>>0;
  const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296};
  const N=32,bars=[];for(let i=0;i<N;i++){const e=h('i'),v=.3+.7*Math.abs(Math.sin(i*.6+rnd()*2.2))*(.5+.5*rnd());e.style.height=Math.round(5+v*20)+'px';e.style.animationDelay=i*18+'ms';wave.append(e);bars.push(e)}

  const paint=p=>{const n=Math.round(Math.max(0,Math.min(1,p))*N);bars.forEach((e,i)=>{e.classList.toggle('on',i<n);e.classList.toggle('cur',playing&&i===n-1)})};
  const stopSelf=()=>{if(a)a.pause();playing=false;w.classList.remove('playing');b.classList.remove('on');b.innerHTML=ICP;bars.forEach(e=>e.classList.remove('cur'));if(stopCur===stopSelf)stopCur=null};
  const ensure=()=>{if(a)return;a=new Audio(m.url);
    a.ontimeupdate=()=>{const d=m.dur||a.duration||1;paint(a.currentTime/d);t.textContent=fmt(a.currentTime)};
    a.onended=()=>{stopSelf();paint(0);t.textContent=fmt(m.dur)}};
  const play=()=>{if(stopCur&&stopCur!==stopSelf)stopCur();ensure();a.play().catch(()=>{});playing=true;w.classList.add('playing');b.classList.add('on');b.innerHTML=ICS;stopCur=stopSelf};
  w.addEventListener('click',ev=>{

    if(playing)stopSelf();else play()});
  bindLP(w,()=>openMenu(w.closest('.msg'),m));
  w.addEventListener('contextmenu',ev=>ev.stopPropagation());
  return w}

function upFile(f,typed){return new Promise((ok,no)=>{
  const x=new XMLHttpRequest(),bar=$('#upb'),i=bar.querySelector('i');x.open('POST','/api/upload');
  x.setRequestHeader('Authorization','Bearer '+tok());if(typed)x.setRequestHeader('Content-Type',typed);else{x.setRequestHeader('Content-Type','application/octet-stream');x.setRequestHeader('X-Kind','file');x.setRequestHeader('X-Filename',encodeURIComponent(f.name))}
  bar.querySelector('span').textContent=f.name;i.style.width='0';bar.classList.add('on');actStart('upload');
  x.upload.onprogress=e=>{if(e.lengthComputable)i.style.width=(e.loaded/e.total*100)+'%'};
  x.onload=()=>{actStopIf('upload');bar.classList.remove('on');try{const j=JSON.parse(x.responseText);x.status<300?ok(j):no(new Error(j.error))}catch{no(new Error('Ошибка'))}};
  x.onerror=()=>{actStopIf('upload');bar.classList.remove('on');no(new Error('Нет соединения'))};x.send(f)})}

/* chat list: long press / right click */
let lastLP=0;
function bindLP(el,fn){let t,x,y,fired=false;
  const fire=()=>{fired=true;lastLP=Date.now();if(navigator.vibrate)navigator.vibrate(12);fn()};
  el.addEventListener('pointerdown',ev=>{if(ev.button>0)return;fired=false;x=ev.clientX;y=ev.clientY;clearTimeout(t);t=setTimeout(fire,450)});
  el.addEventListener('pointermove',ev=>{if(Math.abs(ev.clientX-x)>10||Math.abs(ev.clientY-y)>10)clearTimeout(t)});
  ['pointerup','pointercancel'].forEach(n=>el.addEventListener(n,()=>clearTimeout(t)));
  el.addEventListener('dragstart',ev=>ev.preventDefault());
  el.addEventListener('click',ev=>{if(fired){ev.stopImmediatePropagation();ev.preventDefault()}},true);
  el.addEventListener('contextmenu',ev=>{ev.preventDefault();clearTimeout(t);if(fired||Date.now()-lastLP<900)return;fire()})}

/* voice recording */
let rec,chunks,t0,rtick,rcancel;
async function startRec(){
  try{const s=await navigator.mediaDevices.getUserMedia({audio:true});
  const mt=['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg'].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t))||'';
  const to=cp;rec=new MediaRecorder(s,mt?{mimeType:mt}:{});chunks=[];rcancel=false;
  rec.ondataavailable=e=>chunks.push(e.data);
  rec.onstop=async()=>{s.getTracks().forEach(t=>t.stop());clearInterval(rtick);actStop();$('#recbar').classList.add('hide');$('#inp').classList.remove('hide');if(rcancel)return;
    const dur=Math.round((Date.now()-t0)/1000);if(dur<1)return;
    try{const type=(rec.mimeType||mt||'audio/webm');const url=await upload(new Blob(chunks,{type}),type);if(cp&&to&&cp.id===to.id)send({type:'voice',url,dur})}catch{toast('Не удалось отправить голосовое')}};
  rec.start();t0=Date.now();actStart('voice');$('#rt').textContent='0:00';rtick=setInterval(()=>$('#rt').textContent=fmt((Date.now()-t0)/1000),250);
  $('#inp').classList.add('hide');$('#recbar').classList.remove('hide')}catch{toast('Нет доступа к микрофону')}}
function cancelRec(){if(rec&&rec.state==='recording'){rcancel=true;rec.stop()}}
$('#rc').onclick=cancelRec;$('#rs').onclick=()=>{if(rec&&rec.state==='recording')rec.stop()};

/* calls (WebRTC) */
let ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]};
let pc,ls,cpeer,ctimer,cto,pend=[],inc,muted=false;
function callUI(p,st,m){const c=$('#call');c.classList.add('on');c.classList.remove('live');c.dataset.mode=m;$('#c-av').replaceChildren(av(p,'xl'));$('#c-name').textContent=p.name;$('#c-st').textContent=st;muted=false;$('#c-mute').classList.remove('on')}
function mkPC(to){const p=new RTCPeerConnection(ICE);
  p.onicecandidate=e=>e.candidate&&sock.emit('call:ice',{to,c:e.candidate});
  p.ontrack=e=>{$('#ra').srcObject=e.streams[0];$('#ra').play().catch(()=>{})};
  p.onconnectionstatechange=()=>{const s=p.connectionState;if(s==='connected'){clearTimeout(cto);$('#call').classList.add('live');if(!ctimer){const t=Date.now();ctimer=setInterval(()=>$('#c-st').textContent=fmt((Date.now()-t)/1000),500)}}else if(s==='failed'){toast('Не удалось соединиться');endCall(true)}};
  return p}
async function mic(){try{return await navigator.mediaDevices.getUserMedia({audio:true})}catch{toast('Нет доступа к микрофону');return null}}
async function startCall(p){
  if(pc||inc)return;ls=await mic();if(!ls)return;cpeer=p;callUI(p,'Вызов…','out');startRingback();
  pc=mkPC(p.id);ls.getTracks().forEach(t=>pc.addTrack(t,ls));
  const o=await pc.createOffer();await pc.setLocalDescription(o);sock.emit('call:offer',{to:p.id,sdp:o});
  cto=setTimeout(()=>{toast('Нет ответа');endCall(true)},45000)}
async function acceptCall(){
  const i=inc;inc=null;stopRing();closeNote('call');ls=await mic();if(!ls){sock.emit('call:end',{to:i.from});return endCall(false)}
  pc=mkPC(i.from);ls.getTracks().forEach(t=>pc.addTrack(t,ls));
  await pc.setRemoteDescription(i.sdp);for(const c of pend)await pc.addIceCandidate(c);pend=[];
  const a=await pc.createAnswer();await pc.setLocalDescription(a);sock.emit('call:answer',{to:i.from,sdp:a});
  $('#call').dataset.mode='out';$('#c-st').textContent='Соединение…'}
function endCall(notify){
  stopRing();closeNote('call');
  if(notify&&cpeer&&sock)sock.emit('call:end',{to:cpeer.id});
  if(pc)pc.close();pc=null;if(ls)ls.getTracks().forEach(t=>t.stop());ls=null;
  clearInterval(ctimer);ctimer=null;clearTimeout(cto);pend=[];inc=null;cpeer=null;$('#ra').srcObject=null;$('#call').classList.remove('on')}
$('#callbtn').onclick=()=>{if(cp)startCall(cp)};
$('#c-acc').onclick=acceptCall;
$('#c-dec').onclick=()=>endCall(true);$('#c-end').onclick=()=>endCall(true);
$('#c-mute').onclick=()=>{muted=!muted;if(ls)ls.getAudioTracks().forEach(t=>t.enabled=!muted);$('#c-mute').classList.toggle('on',muted)};

/* screen share */
let shStream=null,shPeer=null,shPCs=new Map(),viewPC=null,viewFrom=null;
const addIce=async(pc,c)=>{if(pc.remoteDescription){try{await pc.addIceCandidate(c)}catch{}}else(pc._q=pc._q||[]).push(c)};
const flushIce=async pc=>{for(const c of pc._q||[]){try{await pc.addIceCandidate(c)}catch{}}pc._q=[]};
function shareCard(m){
  const mine=m.from===me.id,c=h('div','shr'+(m.live?' live':''),ic('screen')+'<div><b></b><small></small></div>');
  c.querySelector('b').textContent=(mine?'Вы начали':(m.fn||'Собеседник')+' начал')+' трансляцию';
  c.querySelector('small').textContent=m.live?'Идёт сейчас':'Трансляция завершена';
  if(m.live){const b=h('button','btn');b.textContent=mine?'Остановить':'Подсоединиться';b.onclick=ev=>{ev.stopPropagation();mine?stopShare(true):joinShare(m)};c.append(b)}
  return c}
async function startShare(){
  if(!cp||cp.type)return;if(shStream)return stopShare(true);
  if(!navigator.mediaDevices||!navigator.mediaDevices.getDisplayMedia)return toast('Трансляция экрана недоступна на этом устройстве');
  try{shStream=await navigator.mediaDevices.getDisplayMedia({video:{frameRate:30},audio:true})}catch{return}
  shPeer=cp;shStream.getVideoTracks()[0].onended=()=>stopShare(true);
  sock.emit('share:start',{to:cp.id});$('#shbar').classList.add('on');$('#shbtn').classList.add('live')}
function stopShare(notify){
  if(shStream){shStream.getTracks().forEach(t=>{t.onended=null;t.stop()});shStream=null}
  shPCs.forEach(p=>p.close());shPCs.clear();shPeer=null;
  $('#shbar').classList.remove('on');$('#shbtn').classList.remove('live');if(notify&&sock)sock.emit('share:end')}
async function onShJoin(d){
  if(!shStream||!shPeer||d.from!==shPeer.id)return;
  const old=shPCs.get(d.from);if(old)old.close();
  const pc=new RTCPeerConnection(ICE);shPCs.set(d.from,pc);
  shStream.getTracks().forEach(t=>pc.addTrack(t,shStream));
  pc.onicecandidate=e=>e.candidate&&sock.emit('share:ice',{to:d.from,c:e.candidate});
  const o=await pc.createOffer();await pc.setLocalDescription(o);sock.emit('share:offer',{to:d.from,sdp:o})}
async function onShAnswer(d){const pc=shPCs.get(d.from);if(!pc)return;await pc.setRemoteDescription(d.sdp);flushIce(pc)}
async function onShOffer(d){
  if(!viewPC||viewFrom!==d.from)return;
  await viewPC.setRemoteDescription(d.sdp);await flushIce(viewPC);
  const a=await viewPC.createAnswer();await viewPC.setLocalDescription(a);sock.emit('share:answer',{to:d.from,sdp:a})}
function onShIce(d){const pc=(viewPC&&viewFrom===d.from)?viewPC:shPCs.get(d.from);if(pc)addIce(pc,d.c)}
function onShLeave(d){const pc=shPCs.get(d.from);if(pc){pc.close();shPCs.delete(d.from)}}
function onShEnd(d){
  const m=mm.get(d.id);if(m){m.live=false;const c=document.querySelector(`.msg[data-id="${d.id}"] .shr`);if(c)c.replaceWith(shareCard(m))}
  if(viewFrom===d.from){leaveShare(false);toast('Трансляция завершена')}
  if(d.from===me.id&&shStream)stopShare(false)}
function joinShare(m){

function gifDur(b){
  if(b.length<13||b[0]!==0x47)return 0;
  let p=13,t=0;const f=b[10];if(f&0x80)p+=3*(2<<(f&7));
  const skip=()=>{while(p<b.length&&b[p])p+=b[p]+1;p++};
  while(p<b.length){const c=b[p++];
    if(c===0x3B)break;
    if(c===0x21){const l=b[p++];if(l===0xF9){const d=b[p+2]|(b[p+3]<<8);t+=(d<=1?10:d)/100}skip()}
    else if(c===0x2C){const lf=b[p+8];p+=9;if(lf&0x80)p+=3*(2<<(lf&7));p++;skip()}
    else break}
  return t}
function vidDur(f){return new Promise((ok,no)=>{const v=document.createElement('video'),u=URL.createObjectURL(f);v.preload='metadata';
  v.onloadedmetadata=()=>{URL.revokeObjectURL(u);isFinite(v.duration)?ok(v.duration):no()};v.onerror=()=>{URL.revokeObjectURL(u);no()};v.src=u})}

  let dur;try{dur=isGif?gifDur(new Uint8Array(await f.arrayBuffer())):await vidDur(f)}catch{return toast('Не удалось прочитать файл')}
  if(dur>10.2)return toast('GIF не может быть длиннее 10 секунд (сейчас '+Math.round(dur)+' с)');
  if(f.size>25e6&&!me.admin)return toast('Файл больше 25 МБ');

    const ptrs=new Map();let lastD=0;const dist=()=>{const [a,b]=[...ptrs.values()];return Math.hypot(a.x-b.x,a.y-b.y)};

let actx=null,swReg=null,ringT=null,lastNote=null;

function tone(f,t0,dur,vol=.18,type='sine'){const c=audioCtx();if(!c)return;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.value=f;o.connect(g);g.connect(c.destination);
  const t=c.currentTime+t0;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.start(t);o.stop(t+dur+.05)}
function playMsg(){if(!pref().snd)return;tone(880,0,.2);tone(1318,.13,.32)}
function startRing(){stopRing();const r=()=>{[0,.55].forEach(o=>{tone(440,o,.42,.2);tone(480,o,.42,.2)});if(navigator.vibrate)navigator.vibrate([400,200,400])};r();ringT=setInterval(r,2600)}
function startRingback(){stopRing();const r=()=>tone(425,0,1.1,.07);r();ringT=setInterval(r,3500)}

  if(!pref().ntf||!('Notification' in window)||Notification.permission!=='granted')return;
  const o={body,tag,icon:'/icon-192.png',badge:'/favicon-64.png',renotify:true,...opts};
  try{if(swReg&&swReg.showNotification)swReg.showNotification(title,o);else{lastNote=new Notification(title,o);lastNote.onclick=()=>{window.focus();lastNote.close()}}}catch{}}

/* links in messages */
const URLRE=/((?:https?:\/\/|www\.)[^\s<>"']+)/gi;
function renderText(el,text){
  el.textContent='';let last=0,m;URLRE.lastIndex=0;
  while((m=URLRE.exec(text))){
    let u=m[0];while(/[.,!?;:)\]»”]$/.test(u))u=u.slice(0,-1);
    if(m.index>last)el.append(document.createTextNode(text.slice(last,m.index)));
    const a=document.createElement('a');a.className='lnk';a.href=/^www\./i.test(u)?'https://'+u:u;a.textContent=u;a.target='_blank';a.rel='noopener noreferrer';el.append(a);
    last=m.index+u.length;URLRE.lastIndex=last}
  if(last<text.length)el.append(document.createTextNode(text.slice(last)))}

['⚽','Активности','⚽ 🏀 🏈 ⚾ 🎾 🏐 🏉 🎱 🏓 🥊 🎯 🎮 🎲 🎸 🎹 🎤 🎧 🎬 🎨 🏆 🥇 🚗 🚕 🚌 🚀 ✈️ 🚲 ⛵ 🏠 🌍 🌙 ☀️ ⛅ 🌈 ❄️ 🌊']];
let emoTab=localStorage.emt||'emoji',stkSel='recent',STK=null,emoBuilt=false;
const emoRecent=()=>{try{return JSON.parse(localStorage.emr||'[]')}catch{return[]}};
function buildEmo(){
  const P=$('#emo');
  P.innerHTML='<div class="etabs"><button data-t="emoji">😀 Эмодзи</button><button data-t="stk">🎟 Стикеры</button><i class="eind"></i></div><div class="ebody" id="ebody"></div><div class="efoot" id="efoot"></div>';
  P.querySelectorAll('.etabs button').forEach(b=>b.onclick=()=>emoShow(b.dataset.t));emoBuilt=true}
function emoShow(t){
  emoTab=t;localStorage.emt=t;const P=$('#emo');
  P.querySelectorAll('.etabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
  P.querySelector('.eind').style.transform='translateX('+(t==='emoji'?0:100)+'%)';
  const body=$('#ebody');body.classList.remove('sw3');void body.offsetWidth;body.classList.add('sw3');
  if(t==='emoji')renderEmoji();else renderStickers()}
function openEmo(){
  if(!cp||isRO(cp)||chatBlocked(cp))return;
  if(!emoBuilt)buildEmo();
  $('#emo').classList.add('open');$('#emob').classList.add('on');emoShow(emoTab)}
function closeEmo(instant){
  const P=$('#emo');if(!P)return;
  if(instant)P.style.transition='none';
  P.classList.remove('open');$('#emob').classList.remove('on');
  if(instant){void P.offsetHeight;P.style.transition=''}}
$('#emob').onclick=()=>{$('#emo').classList.contains('open')?closeEmo():openEmo()};
$('#txt').addEventListener('focus',()=>{if(matchMedia('(pointer:coarse)').matches)closeEmo()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#emo').classList.contains('open')&&!document.querySelector('.sw')){e.stopImmediatePropagation();closeEmo()}},true);
function insEmo(ch){
  const t=$('#txt'),a=t.selectionStart==null?t.value.length:t.selectionStart,b=t.selectionEnd==null?a:t.selectionEnd;
  t.setRangeText(ch,a,b,'end');t.dispatchEvent(new Event('input'));
  const r=emoRecent().filter(x=>x!==ch);r.unshift(ch);localStorage.emr=JSON.stringify(r.slice(0,24))}
function renderEmoji(){
  const body=$('#ebody'),foot=$('#efoot');body.innerHTML='';foot.innerHTML='';
  const cats=[['🕘','Недавние',emoRecent().join(' ')],...EMO].filter(c=>c[2]);
  cats.forEach((c,ci)=>{
    const sec=h('div','esec'),g=h('div','egrid');sec.textContent=c[1];
    c[2].split(' ').filter(Boolean).forEach((ch,i)=>{const b=h('button','eb');b.textContent=ch;b.style.animationDelay=Math.min(i,28)*9+'ms';b.onclick=()=>insEmo(ch);g.append(b)});
    body.append(sec,g);
    const f=h('button',ci===0?'on':'');f.textContent=c[0];
    f.onclick=()=>{body.scrollTo({top:sec.offsetTop-body.offsetTop-4,behavior:'smooth'});foot.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===f))};foot.append(f)})}
async function loadStk(force){if(STK&&!force)return STK;STK=await api('/api/stickers');return STK}
function sendSticker(s){
  if(!cp||chatBlocked(cp)||isRO(cp))return;
  send({type:'sticker',sid:s.id,url:s.url});
  if(STK)STK.recent=[s,...STK.recent.filter(x=>x.id!==s.id)].slice(0,30)}
async function favSticker(id,on){
  try{await api('/api/stickers/fav',{method:'POST',body:JSON.stringify({id,on})});await loadStk(true);toast(on?'Добавлено в избранное':'Убрано из избранного');
    if($('#emo').classList.contains('open')&&emoTab==='stk')renderStickers()}catch(e){toast(e.message)}}
function stkMenu(btn,s,isFav){
  const it=[{t:isFav?'Убрать из избранного':'В избранное',i:'star',fn:()=>favSticker(s.id,!isFav)}];
  if(s.own||(me&&me.root))it.push({t:'Удалить стикер',i:'trash',red:1,fn:()=>confirmAct('Удалить стикер?','Он исчезнет из пака у всех.','Удалить',true,async()=>{await api('/api/stickers/'+s.id,{method:'DELETE'});await loadStk(true);renderStickers()})});
  popMenu(btn,it,'left',btn,true)}
async function renderStickers(hl){
  const body=$('#ebody'),foot=$('#efoot');
  body.innerHTML='<div class="sempty">Загрузка…</div>';
  try{await loadStk(!!hl)}catch{body.innerHTML='<div class="sempty">Не удалось загрузить стикеры</div>';return}
  if(emoTab!=='stk')return;
  const favIds=new Set(STK.favs.map(x=>x.id));
  foot.innerHTML='';
  const mkF=(key,content,title)=>{const b=h('button',stkSel===key?'on':'');if(typeof content==='string')b.textContent=content;else b.append(content);b.title=title||'';b.onclick=()=>{stkSel=key;renderStickers()};foot.append(b);return b};
  mkF('recent','🕘','Недавние');mkF('fav','⭐','Избранные');
  STK.packs.forEach(p=>{const im=p.stickers[0]?Object.assign(new Image(),{src:p.stickers[0].url}):'🎟';mkF(p.id,im,p.title)});
  mkF('catalog','＋','Каталог и новые паки');
  const on=foot.querySelector('.on');if(on&&on.scrollIntoView)on.scrollIntoView({inline:'center',block:'nearest'});
  body.innerHTML='';
  const mkBtn=(txt,fn)=>{const b=h('button','btn sec');b.textContent=txt;b.onclick=fn;return b};
  const head=(title,btns)=>{const hd=h('div','shead'),t=h('b');t.textContent=title;hd.append(t,...btns);body.append(hd)};
  const grid=list=>{
    if(!list.length){body.append(h('div','sempty','Здесь пока пусто'));return}
    const g=h('div','sgrid');
    list.forEach((s,i)=>{const b=h('button','sti'+(hl===s.id?' new':'')),im=new Image();im.src=s.url;im.loading='lazy';im.alt='';im.style.animationDelay=Math.min(i,20)*25+'ms';b.append(im);
      b.onclick=()=>{sendSticker(s);b.classList.remove('sent');void b.offsetWidth;b.classList.add('sent')};
      bindLP(b,()=>stkMenu(b,s,favIds.has(s.id)));g.append(b)});
    body.append(g)};
  if(stkSel==='recent'){head('Недавние',[mkBtn('＋ Создать стикер',()=>createSticker())]);grid(STK.recent)}
  else if(stkSel==='fav'){head('Избранные',[mkBtn('＋ Создать стикер',()=>createSticker())]);grid(STK.favs)}
  else if(stkSel==='catalog')renderCatalog(body);
  else{
    const p=STK.packs.find(x=>x.id===stkSel);if(!p){stkSel='recent';return renderStickers()}
    if(p.mine){const mb=mkBtn('⋯',()=>popMenu(mb,[{t:'Переименовать',i:'edit',fn:()=>renamePack(p)},{t:'Удалить пак',i:'trash',red:1,fn:()=>confirmAct('Удалить пак «'+p.title+'»?','Все стикеры из него будут удалены.','Удалить',true,async()=>{await api('/api/packs/'+p.id,{method:'DELETE'});stkSel='recent';await loadStk(true);renderStickers()})}],'right'));
      head(p.title,[mkBtn('＋ Стикер',()=>createSticker(p.id)),mb])}
    else head(p.title,[mkBtn('Убрать',()=>libPack(p.id,false))]);
    grid(p.stickers)}}
async function libPack(id,on){try{await api('/api/packs/'+id+'/lib',{method:'POST',body:JSON.stringify({on})});await loadStk(true);if(!on&&stkSel===id)stkSel='recent';renderStickers();toast(on?'Пак добавлен':'Пак убран')}catch(e){toast(e.message)}}
async function renderCatalog(body){
  const hd=h('div','shead'),t=h('b'),nb=h('button','btn sec');t.textContent='Стикерпаки';nb.textContent='＋ Новый пак';nb.onclick=createPack;hd.append(t,nb);body.append(hd);
  const box=h('div');box.append(h('div','sempty','Загрузка…'));body.append(box);
  try{const l=await api('/api/stickers/catalog');box.innerHTML='';
    if(!l.length)box.append(h('div','sempty','Паков пока нет — создайте первый'));
    l.forEach((p,i)=>{
      const r=h('div','prow2'),th=p.cover?Object.assign(new Image(),{src:p.cover}):h('div','pth','🎟'),mid=h('div','pmid','<b></b><small></small>'),bt=h('button','btn'+(p.added?' sec':''));
      r.style.animation='up .35s '+Math.min(i,10)*40+'ms backwards';mid.firstChild.textContent=p.title;mid.lastChild.textContent=p.count+' стикеров';
      bt.style.cssText='width:auto;padding:6px 12px;font-size:13px';bt.textContent=p.mine?'Мой':(p.added?'Убрать':'Добавить');
      bt.onclick=()=>{if(p.mine){stkSel=p.id;renderStickers()}else libPack(p.id,!p.added)};r.append(th,mid,bt);box.append(r)})}
  catch{box.innerHTML='<div class="sempty">Не удалось загрузить каталог</div>'}}
function createPack(){
  sheet('Новый стикерпак',(b,close)=>{
    const inp=h('input','fld'),ok=h('button','btn');inp.placeholder='Название пака';inp.maxLength=30;ok.textContent='Создать';
    const go=async()=>{if(!inp.value.trim())return toast('Введите название');try{const r=await api('/api/packs',{method:'POST',body:JSON.stringify({title:inp.value})});close();await loadStk(true);stkSel=r.id;renderStickers();toast('Пак создан')}catch(e){toast(e.message)}};
    ok.onclick=go;inp.onkeydown=e=>{if(e.key==='Enter')go()};b.append(inp,ok);setTimeout(()=>inp.focus(),300)})}
function renamePack(p){
  sheet('Переименовать пак',(b,close)=>{
    const inp=h('input','fld'),ok=h('button','btn');inp.value=p.title;inp.maxLength=30;ok.textContent='Сохранить';
    ok.onclick=async()=>{try{await api('/api/packs/'+p.id,{method:'PUT',body:JSON.stringify({title:inp.value})});close();await loadStk(true);renderStickers()}catch(e){toast(e.message)}};b.append(inp,ok)})}
function createSticker(packId){
  const fi=document.createElement('input');fi.type='file';fi.accept='image/*';
  fi.onchange=async()=>{
    const f=fi.files[0];if(!f)return;
    try{const bl=await avatarEditor(f,{shape:'square',title:'Новый стикер',size:512,mime:'image/webp',transparent:true});if(!bl)return;
      const url=await upload(bl,bl.type||'image/webp');
      const r=await api('/api/stickers',{method:'POST',body:JSON.stringify({url,pack:packId||undefined})});
      await loadStk(true);stkSel=r.pack.id;await renderStickers(r.sticker.id);toast('Стикер создан')}
    catch(e){toast(e.message||'Не удалось создать стикер')}};
  fi.click()}

/* boot */
(async()=>{
  if(!accs.length){const bk=await idbGet('accs');if(bk&&bk.accs&&bk.accs.length){accs=bk.accs;cur=bk.cur;saveA()}}
  try{const st=await(await fetch('/api/status',{cache:'no-store'})).json();maint=!!st.maint}catch{}
  renderLock();
  if(!accs.length)showAuth(false);
  else{if(!accs.find(a=>a.id===cur))cur=(accs.find(a=>!a.banned&&!a.expired)||accs[0]).id;start()}
})();
</script>
